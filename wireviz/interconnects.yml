  - - ZONE3_DASH: [2, 2, 2, 2, 2, 2]
    - W_Z3_Z4_Z1: [2, 3, 4, 5, 6, 7]
    - C3_FWD_LIGHT: [2, 3, 4, 5, 6, 7]
  - - C3_FWD_LIGHT: [1, 2, 3, 4, 5, 6, 7, 8]
    - W_Z3_Z4_Z1: [1, 2, 3, 4, 5, 6, 7, 8]
    - ZONE1_FRONT: [1, 1, 1, 1, 1, 1, 1, 1]

  - - ZONE2_EFI: [1, 1, 1, 1, 1]
