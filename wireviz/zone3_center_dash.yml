metadata:
  title: "1978 Datsun 280Z — Zone 3: Center Dash, Combination Meter, Switches & Cabin Relays"
  pn: "FSM-1978-280Z-Z3"
  notes: |
    Source: 1978 Color Wiring Diagram.pdf (Page 3 / Zone 3) & markdown/1978 Color Wiring Diagram.md

connectors:
  CLOCK:
    type: Dash Clock
    pinlabels: ["Power (+) (R - Fuse 2)", "Illum (RL)", "Ground (B)"]
  VOLTMETER:
    type: Center Voltmeter
    pinlabels: ["Power (+) (BW - Fuse 10)", "Ground (B)"]
  FUEL_GAUGE:
    type: Fuel Level Gauge
    pinlabels: ["Power (+) (BW - Fuse 10)", "Sender (YL)", "Warning Lamp (YG)"]
  TEMP_GAUGE:
    type: Water Temp Gauge
    pinlabels: ["Power (+) (BW - Fuse 10)", "Sender (YW)"]
  OIL_GAUGE:
    type: Oil Pressure Gauge
    pinlabels: ["Power (+) (BW - Fuse 10)", "Sender (YB)"]
  TACHOMETER:
    type: Tachometer
    pinlabels: ["Power (+) (BW)", "RPM Pulse (L)", "Ground (B)", "LH Turn (GB)", "RH Turn (GY)"]
  SPEEDOMETER:
    type: Speedometer Cluster
    pinlabels: ["High Beam Pilot (RB/RY)", "Brake Warning (YR)", "Floor Temp (R/Y)"]
  RHEOSTAT:
    type: Instrument Dimmer Rheostat
    pinlabels: ["Feed (RL)", "Dimmed Out (RL)", "Ground (B)"]
  IGN_SWITCH:
    type: Ignition Switch
    pinlabels: ["B (W - Fusible Link)", "ACC (L - Fuse 7/8)", "ON (BW - Ign Relay)", "STA (BY - Starter)"]
  COMB_SWITCH:
    type: Steering Column Combination Switch
    pinlabels:
      - "Light 8 (R - Fuse 4/5)"
      - "Light 7 (RL - Fuse 3)"
      - "Dimmer Low (RW/RL)"
      - "Dimmer High (RB/RY)"
      - "Turn In (G)"
      - "Turn LH (GB)"
      - "Turn RH (GY)"
      - "Horn Ground (G)"
      - "Wiper Feed 2 (L - Fuse 7)"
      - "Wiper L (L)"
      - "Wiper H (H)"
      - "Wiper P (P)"
  WIPER_AMP:
    type: Intermittent Wiper Amplifier
    pinlabels: ["1", "W", "2", "B", "P", "M", "E"]
  HORN_RELAY:
    type: Horn Relay (Cabin Bracket)
    pinlabels: ["Coil Feed (GW - Fuse 1)", "Coil Ground (G)", "Contact Out (GB)"]
  DEFOGGER_RELAY:
    type: Rear Defogger Relay
    pinlabels: ["Contact In (Fuse 6)", "Contact Out (Grid)"]
  IGN_RELAY:
    type: Ignition Relay
    pinlabels: ["Coil In (BW)", "Contact Out (BW IGN Bus)"]
  SEATBELT_TIMER:
    type: Seat Belt Timer Unit
    pinlabels: ["Power (BW)", "Ground (B)", "Warning (YR)"]
  TURN_FLASHER:
    type: Turn Signal Flasher (3-Pin)
    pinlabels: ["Feed (G - Fuse 9)", "Out (GR)", "Ground (B)"]
  HAZARD_FLASHER:
    type: Hazard Flasher (2-Pin)
    pinlabels: ["Feed (GW - Fuse 1)", "Out (G)"]
  FUSE_HARNESS_Z4:
    type: "Zone 4 / Fuse Box and Senders Interface"
    pinlabels:
      - "Fuse 1 (GW)"
      - "Fuse 2 (R)"
      - "Fuse 3 (RL)"
      - "Fuse 4/5 (R)"
      - "Fuse 6 (Defogger)"
      - "Fuse 7/8 (L ACC)"
      - "Fuse 9 (G)"
      - "Fuse 10 (BW IGN)"
      - "Tank Sender (YL)"
      - "Low Fuel (YG)"
      - "Water Sender (YW)"
      - "Oil Sender (YB)"
      - "Coil (-) (L)"
      - "Wiper Motor"
      - "Horns (GB)"
  GND_DASH:
    type: Dash Ground
    style: simple
    pinlabels: [Dash Chassis Earth]

cables:
  W_GAUGES:
    wirecount: 10
    colors: [RD, RDBU, BK, BKWH, YEBU, YEGN, YEWH, YEBK, BU, YERD]
  W_IGN_SW:
    wirecount: 4
    colors: [WH, BU, BKWH, BKYE]
  W_COMB_LIGHT:
    wirecount: 7
    colors: [RD, RDBU, RDWH, RDBK, GN, GNBK, GNYE]
  W_COMB_WIPER:
    wirecount: 5
    colors: [GN, BU, BU, PK, BK]
  W_RELAYS_DASH:
    wirecount: 6
    colors: [GNWH, GN, GNBK, BKWH, GN, GNRD]

connections:
  - - FUSE_HARNESS_Z4: [2]
    - W_GAUGES: [1]
    - CLOCK: [1]
  - - RHEOSTAT: [2]
    - W_GAUGES: [2]
    - CLOCK: [2]
